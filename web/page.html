/* real bets (16 Oct) */
button.take { font: 600 11.5px var(--body); color: var(--accent-ink); background: var(--good-bg); border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 9px; margin-top: 4px; cursor: pointer; white-space: nowrap; }

#takeDlg input { width: 100%; box-sizing: border-box; font: 500 15px var(--mono); color: var(--ink); background: var(--sunk); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px; }

<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow" id="eyebrow">SB-MS-2026 · paper · loading…</div>
    <h1 id="h1">Reading the model…</h1>
    <p class="lede" id="lede"></p>
    <p class="note refresh" style="margin-top:8px"><span class="live"><span class="dot" id="dot"></span><span id="status">Connecting</span></span> · refreshes every 5 minutes · <a href="#" id="reload">refresh now</a></p>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="panels"></main>
</div>
<dialog id="takeDlg" aria-labelledby="takeTitle">
  <form method="dialog" id="takeForm">
    <h2 id="takeTitle">I took this bet</h2>
    <p class="what" id="takeWhat"></p>
    <div class="row2">
      <div><label for="takeOdds">Odds taken (decimal)</label><input id="takeOdds" type="number" step="0.01" min="1.01" max="1000" inputmode="decimal" required></div>
      <div><label for="takeStake">Stake (£)</label><input id="takeStake" type="number" step="0.01" min="0.01" max="100000" inputmode="decimal" required></div>
    </div>
    <div class="calc" id="takeCalc"></div>
    <label for="takeNote">Note (optional)</label><input id="takeNote" type="text" maxlength="300" style="font-family: var(--body)">
    <div id="takeKeyWrap"><label for="takeKey">Bets key (asked once, kept in this browser)</label><input id="takeKey" type="password" autocomplete="off" style="font-family: var(--body)"></div>
    <p class="err" id="takeErr" role="alert"></p>
    <div class="acts"><button type="button" id="takeCancel">Cancel</button><button type="submit" class="go" id="takeGo">Log this bet</button></div>
  </form>
</dialog>
<script>
(function () {
  'use strict';
  var DATA_URL = location.pathname.replace(/\/+$/, '') + '/page-data' + location.search;
  var TZ = 'Europe/London';
  var state = { data: null, tab: (location.hash || '').slice(1), mv: {} };

  // ---------------------------------------------------------------- formatting
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function num(x) { return x == null || x === '' || isNaN(Number(x)) ? null : Number(x); }
  function pc(x, d) { x = num(x); return x == null ? '—' : (x * 100).toFixed(d == null ? 1 : d) + '%'; }
  function spc(x, d) { x = num(x); return x == null ? '—' : (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(d == null ? 1 : d) + '%'; }
  function od(x) { x = num(x); return x == null ? '—' : x.toFixed(2); }
  function f3(x) { x = num(x); return x == null ? '—' : x.toFixed(3); }
  function f4(x) { x = num(x); return x == null ? '—' : x.toFixed(4); }
  function money(x) { x = num(x); if (x == null) return '—'; return (x >= 0 ? '+£' : '−£') + Math.abs(x).toFixed(2); }
  function sign(x) { x = num(x); return x == null ? '' : (x > 0 ? 'pos' : (x < 0 ? 'neg' : '')); }
  function chip(t, k) { return '<span class="chip c-' + (k || 'plain') + '">' + e(t) + '</span>'; }
  function dayKey(d) { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(d)); }
  function dayLabel(k) { var d = new Date(k + 'T12:00:00Z'); return new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' }).format(d); }
  function dayShort(k) { var d = new Date(k + 'T12:00:00Z'); return new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' }).format(d); }
  function hm(d) { return d ? new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(new Date(d)) : '—'; }
  function dhm(d) { return d ? new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(d)) : '—'; }
  function ago(d, now) { if (!d) return '—'; var m = Math.round((new Date(now) - new Date(d)) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; var h = Math.floor(m / 60); if (h < 48) return h + ' h ' + (m % 60) + ' min ago'; return Math.floor(h / 24) + ' days ago'; }
  function sum(a, f) { return a.reduce(function (s, x) { var v = num(f(x)); return s + (v == null ? 0 : v); }, 0); }
  function mean(a, f) { var v = a.map(f).map(num).filter(function (x) { return x != null; }); return v.length ? v.reduce(function (s, x) { return s + x; }, 0) / v.length : null; }
  function kpi(items) { return '<div class="kpi">' + items.map(function (i) { return '<div><b class="' + (i[2] || '') + '">' + e(i[0]) + '</b><span>' + e(i[1]) + '</span></div>'; }).join('') + '</div>'; }
  function table(heads, rows, cls) {
    return '<div class="scroll"><table class="' + (cls || 'nopick') + '"><thead><tr>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        var attrs = r.cls ? ' class="' + r.cls + '"' : '';
        if (r.fx) attrs += ' data-fx="' + r.fx + '" tabindex="0"';
        return '<tr' + attrs + '>' + (r.cells || r).map(function (c) { return Array.isArray(c) ? '<td' + c[1] + '>' + c[0] + '</td>' : '<td>' + c + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  function section(title, body, opts) { opts = opts || {}; return '<div class="sec' + (opts.first ? ' first' : '') + '"' + (opts.mv ? ' data-mv="' + opts.mv + '"' : '') + '><h2>' + title + '</h2>' + body + '</div>'; }
  function details(summary, body, id, note) { return '<details class="fx"' + (id ? ' id="' + id + '"' : '') + '><summary><span class="chev">▸</span>' + summary + (note ? ' <span class="muted">' + e(note) + '</span>' : '') + '</summary><div class="fx-body">' + body + '</div></details>'; }
  function card(b) { return '<div class="card">' + b + '</div>'; }

  var KEY_LABEL = { H: 'Home', D: 'Draw', A: 'Away', DNB_H: 'Home DNB', DNB_A: 'Away DNB', BTTS_Y: 'Both score', BTTS_N: 'Not both score', 'O1.5': 'Over 1.5', 'U1.5': 'Under 1.5', 'O2.5': 'Over 2.5', 'U2.5': 'Under 2.5', 'O3.5': 'Over 3.5', 'U3.5': 'Under 3.5' };
  var KEY_ORDER = ['H', 'D', 'A', 'DNB_H', 'DNB_A', 'BTTS_Y', 'BTTS_N', 'O1.5', 'U1.5', 'O2.5', 'U2.5', 'O3.5', 'U3.5'];
  function sel(key, f) { if (!f) return KEY_LABEL[key] || key; if (key === 'H' || key === 'DNB_H') return f.home + (key === 'DNB_H' ? ' (draw no bet)' : ''); if (key === 'A' || key === 'DNB_A') return f.away + (key === 'DNB_A' ? ' (draw no bet)' : ''); return KEY_LABEL[key] || key; }
  function modelLabel(m) {
    if (m === 'dixon_coles') return 'Dixon-Coles (champion)';
    if (m === 'elo_cross') return 'ClubElo (European ties)';
    if (m === 'market_consensus') return 'Challenger: the markets\' own consensus';
    if (m === 'sharp_pinnacle') return 'Challenger: Pinnacle\'s prices';
    if (m === 'committee') return 'Challenger: the committee (every variant votes)';
    if (m === 'dixon_coles:cs') return 'Correct score (the champion\'s scoreline grid)';
    if (String(m).indexOf('dixon_coles~') === 0) return 'Challenger: ' + ({ fade_slower: 'old results fade slower', fade_faster: 'old results fade faster', uncalibrated: 'no bias correction', no_weather: 'weather ignored', no_referee: 'referee ignored', shrunk: 'thin-data ratings pulled to average', unshrunk: 'no rating pull', shots: 'goals + shots on target', pyramid: 'whole-pyramid fit', xg: 'goals + xG', prices: 'ratings from closing prices', goals: 'goals only' }[m.slice(12)] || m.slice(12).replace(/_/g, ' '));
    return String(m).replace('dixon_coles+', 'DC + ').replace(/_/g, ' ');
  }
  function isChallenger(m) { return String(m).indexOf('~') > 0 || m === 'market_consensus' || m === 'sharp_pinnacle' || m === 'committee'; }
  function roleChip(d, m) { return d.isLive(m) ? chip('live', 'sturdy') : isChallenger(m) ? chip('challenger', 'cap') : chip('testing', 'frag'); }
  function gateText(g, key, s) {
    if (g === 'threshold') return 'below the ' + (/^(H|D|A|DNB_)/.test(key) ? pc(s && s.thresh_result, 0) : pc(s && s.thresh_goals, 0)) + ' gate';
    if (g === 'floor') return 'no price clears the floor';
    if (g === 'untraded') return 'untraded (old S-1a gate)';
    if (g === 'thin') return 'spread too wide (old line)';

    if (notes.data_errors) probs.push('<b>Results data failed</b> for ' + Object.keys(notes.data_errors).map(function (k) { return e(k) + ' <span class="note">(' + e(notes.data_errors[k]) + ')</span>'; }).join(', '));
    if (notes.thin_data) probs.push('<b>Too few matches to fit</b>: ' + Object.keys(notes.thin_data).map(function (k) { return e(k) + ' (' + e(notes.thin_data[k]) + ')'; }).join(', '));
    if (notes.clubelo_error) probs.push('<b>ClubElo failed</b>: ' + e(notes.clubelo_error));
    if (notes.xg_errors) probs.push('<b>xG (Understat) failed</b> for ' + Object.keys(notes.xg_errors).map(function (k) { return e(k) + ' <span class="note">(' + e(notes.xg_errors[k]) + ')</span>'; }).join(', '));
    if (notes.xg_name_misses) probs.push('<b>xG team names not matched</b>: ' + Object.keys(notes.xg_name_misses).map(function (k) { return e(k) + ': ' + e(notes.xg_name_misses[k].join(', ')); }).join('; '));
    if (notes.fit_errors) probs.push('<b>Fits failed</b>: ' + Object.keys(notes.fit_errors).map(function (k) { return e(k) + ' <span class="note">(' + e(notes.fit_errors[k]) + ')</span>'; }).join(', '));
    if (notes.event_errors && notes.event_errors.length) probs.push('<b>' + notes.event_errors.length + ' fixtures failed to price</b>' + details('show', '<ul>' + notes.event_errors.map(function (x) { return '<li class="mono">' + e(x) + '</li>'; }).join('') + '</ul>'));
    var stuck = d.suggestions.filter(function (x) { return x.status === 'open' && x.f && (new Date(d.now) - new Date(x.f.kickoff)) > 24 * 3600e3; });
    if (stuck.length) probs.push('<b>' + stuck.length + ' selection' + (stuck.length === 1 ? '' : 's') + ' still open more than 24 hours after kick-off</b> (a market Smarkets has not settled yet, or a settlement state the bot does not recognise): ' + stuck.slice(0, 8).map(function (x) { return e(x.f.home + ' v ' + x.f.away + ' ' + sel(x.key, x.f)); }).join(', '));
    html += section('Problems in the last full run', probs.length ? probs.map(function (p) { return '<div class="warn">' + p + '</div>'; }).join('') : '<p class="muted">None reported.</p>');
    html += section('Competitions seen but not priced', (d.unmapped.length ? '<p class="muted">Smarkets competitions the bot saw but could not map to a league. The ones that should be priced get added to <span class="mono">sbms/config.py</span>.</p>' + table(['Smarkets slug', 'Events seen', 'Last seen', 'How'], d.unmapped.map(function (u) { return ['<span class="mono">' + e(u.slug) + '</span>', [u.n_events, ' class="mono"'], e(dhm(u.last_seen)), e(u.how)]; }), 'var') : '<p class="muted">None.</p>') +
      (d.inferred.length ? details('<b>Matched by country only — not priced until confirmed as the top flight</b>', table(['Slug', 'Mapped to', 'Events'], d.inferred.map(function (u) { return ['<span class="mono">' + e(u.slug) + '</span>', e(u.mapped_to), [u.n_events, ' class="mono"']]; }), 'var'), '', d.inferred.length + ' competitions') : ''));
    // idea 33: the data guardian; idea 32: the circuit breaker
    var gd = d.guardian || [], blocks = gd.filter(function (g) { return g.level === 'block'; });
    html += section('Data guardian', '<p class="muted">Checks on every run that stop bad data becoming a bet (idea 33): a broken or crossed book, a goal expectation out of range or probabilities that do not add up, the model and market 25+ points apart on a result (far more often a wrong team match than an edge), and results data 28+ days old. A blocked fixture is still predicted and scored; it just gets no bet from that variant. Last 7 days, each finding once per 12 hours.</p>' +
      kpi([[blocks.length, 'bets blocked', blocks.length ? 'neg' : ''], [gd.length - blocks.length, 'warnings']]) +
      (gd.length ? details('<b>Findings</b>', table(['When', 'Check', 'League', 'Fixture', 'Variant', 'Detail'], gd.slice(0, 120).map(function (g) { return [e(dhm(g.at)), chip(g.check_name, g.level === 'block' ? 'neg' : ''), e(g.league), g.fixture_id ? '<span class="mono">' + e(g.fixture_id) + '</span>' : '', e(g.model ? modelLabel(g.model) : ''), e(g.detail)]; }), 'var'), '', gd.length + ' findings') : '<p class="muted">Nothing found.</p>'));
    var br = (d.tuning || []).filter(function (r) { return r.kind === 'breaker'; }), brNow = {};
    br.slice().reverse().forEach(function (r) { brNow[r.league] = r; });
    var brOn = Object.keys(brNow).filter(function (k) { return brNow[k].adopted; });
    html += section('Circuit breaker', '<p class="muted">A league whose last ' + 30 + ' live bets have averaged a closing-line value below −3% stops being featured (idea 32). Its bets are still recorded, so it can earn its way back: featured again once the same average is above 0. Every trip and reset is logged.</p>' +
      (brOn.length ? '<div class="warn"><b>Not featured now:</b> ' + e(brOn.join(', ')) + '</div>' : '<p class="muted">No league tripped.</p>') +
      (br.length ? table(['When', 'League', 'Change', 'Mean CLV', 'Bets'], br.slice(0, 40).map(function (r) { var ev = r.evidence || {}; return [e(dhm(r.decided_at)), e(r.league), chip(r.adopted ? 'tripped' : 'reset', r.adopted ? 'neg' : 'pos'), [spc(ev.mean_clv), ' class="mono"'], [ev.bets, ' class="mono"']]; }), 'var') : ''));
    var mt = d.marketTypes || [];
    html += section('Market types on Smarkets', mt.length ? '<p class="muted">Every market type the bot has seen on football events, so extra markets (correct score, Asian handicaps, half-time) can be wired to their real names (idea 16). Priced today: result, draw no bet, both teams to score, over/under 1.5 / 2.5 / 3.5.</p>' + table(['Type', 'Parameter', 'Seen', 'Last seen', 'Selections (sample)'], mt.map(function (r) { var sm_ = r.sample || []; return ['<span class="mono">' + e(r.name) + '</span>', '<span class="mono">' + e(r.param) + '</span>', [r.n, ' class="mono"'], e(dhm(r.last_seen)), sm_.length ? '<span class="sub">' + e(sm_.slice(0, 8).map(function (c) { return (c.name || c.slug || '?') + (c.type ? ' [' + c.type + (c.param != null ? ' ' + c.param : '') + ']' : ''); }).join(' · ')) + (sm_.length > 8 ? ' …' : '') + '</span>' : '<span class="muted">—</span>']; }), 'var') : '<p class="muted">None recorded yet (from the next full run).</p>');
    html += section('Team names not matched', d.names.length ? '<p class="muted">Exchange names the bot could not match to its results data. These fixtures are skipped until an alias is added to <span class="mono">sbms/names.py</span>.</p>' + table(['League', 'Exchange name', 'Detail', 'Last seen'], d.names.map(function (n) { return [e(n.league), '<b>' + e(n.name) + '</b>', '<span class="note">' + e(n.detail) + '</span>', e(dhm(n.seen_at))]; }), 'var') : '<p class="muted">None.</p>');
    var note = !lf ? 'no full run yet' : (errs.length ? errs.length + (errs.length === 1 ? ' error' : ' errors') : 'OK · ' + ago(lf.finished_at, d.now));
    return { html: html, note: note };
  }

  // ---------------------------------------------------------------- page
  function render(d) {
    d = shape(d);
    var todayTab = null, tabs = [];
    d.days.forEach(function (k) {
      if (k < d.todayK && !d.fixtures.some(function (f) { return f.day === k; })) return;
      var t = dayTab(d, k), label = k === d.todayK ? 'Today' : (k < d.todayK ? 'Yesterday' : dayShort(k));
      tabs.push({ id: 'd' + k, label: label, note: t.note, html: t.html }); if (k === d.todayK) todayTab = 'd' + k;
    });
    var p = pnlTab(d), rb = realTab(d), ip = inplayTab(d), m = modelTab(d), rsch = researchTab(d), h = healthTab(d);
    tabs.push({ id: 'real', label: 'Real P&L', note: rb.note, html: rb.html }, { id: 'pnl', label: 'Paper P&L', note: p.note, html: p.html }, { id: 'inplay', label: 'In-play', note: ip.note, html: ip.html }, { id: 'model', label: 'Model', note: m.note, html: m.html }, { id: 'research', label: 'Research', note: rsch.note, html: rsch.html }, { id: 'health', label: 'Health', note: h.note, html: h.html });

    // masthead, all computed
    var s = d.settings, lf = d.lastFull, liveM = (s && s.live_model) || 'dixon_coles';
    var todayFx = d.fixtures.filter(function (f) { return f.day === d.todayK; });
    var todayFeat = [].concat.apply([], todayFx.map(function (f) { return f.sugs; })).filter(function (x) { return d.isLive(x.model) && x.featured && x.order_type === 'take'; });
    var nPriced = d.fixtures.filter(function (f) { return f.day >= d.todayK && Object.keys(f.preds).length; }).length;
    document.getElementById('eyebrow').textContent = 'SB-MS-2026 · paper · live model ' + modelLabel(liveM) + ' · ' + nPriced + ' fixtures priced ahead · last full run ' + (lf ? dhm(lf.finished_at) + ' UK' : 'never') + ' · page read ' + hm(d.now) + ' UK';
    var h1;
    if (!d.runs.length) h1 = 'Waiting for the first run';
    else {
      var todayS = [].concat.apply([], todayFx.map(function (f) { return f.sugs; })).filter(function (x) { return d.isLive(x.model); });
      var nF = todayS.filter(function (x) { return x.card === 'forced'; }).length, nR = todayS.filter(function (x) { return x.card === 'rest'; }).length;
      if (nF || nR) h1 = 'Today: ' + todayFeat.length + ' bet' + (todayFeat.length === 1 ? '' : 's') + ' · ' + nF + ' forced · ' + nR + ' to rest';
      else if (!todayFeat.length) h1 = todayFx.length ? 'No bets today — no price on offer cleared the floor' : 'No covered fixtures today';
      else h1 = todayFeat.length + ' paper bet' + (todayFeat.length === 1 ? '' : 's') + ' today';
    }
    document.getElementById('h1').textContent = h1;
    var o = d.board.filter(function (b) { return b.league == null && b.model === liveM; })[0];
    var liveBook = d.book.filter(function (x) { return d.isLive(x.model) && x.order_type === 'take' && x.status === 'settled'; });
    var bt = d.backtest, btn = sum(bt, function (x) { return x.n; });
    var lede = [];
    if (o && num(o.n)) { var g = num(o.ll_model) - num(o.ll_market); lede.push('Over <b>' + o.n + '</b> settled fixtures the ' + (g < 0 ? '<b>model is ahead of the market</b>' : '<b>market is ahead of the model</b>') + ' (log loss ' + f4(o.ll_model) + ' v ' + f4(o.ll_market) + ').'); }
    else lede.push('No settled fixtures scored yet, so there is no verdict on model v market.');
    if (btn) { var bm = sum(bt, function (x) { return num(x.ll_model) * num(x.n); }) / btn, bk = sum(bt, function (x) { return num(x.ll_market) * num(x.n); }) / btn; lede.push('The back-test over <b>' + btn + '</b> past matches has the model ' + (bm < bk ? '<b>ahead</b>' : '<b>behind</b>') + ' Pinnacle\'s close by ' + Math.abs(bm - bk).toFixed(4) + '.'); }
    else lede.push('No back-test yet.');
    if (liveBook.length) lede.push('Paper book: <b>' + liveBook.length + '</b> bets settled, <b>' + money(sum(liveBook, function (x) { return x.paper_pnl; })) + '</b>, mean CLV <b>' + spc(mean(liveBook, function (x) { return x.clv; })) + '</b>.');
    lede.push('Everything here is paper.');
    document.getElementById('lede').innerHTML = lede.join(' ');

    // keep what the reader had open
    var open = [].slice.call(document.querySelectorAll('details[open]')).map(function (x) { return x.id; }).filter(Boolean);
    var want = state.tab && tabs.some(function (t) { return t.id === state.tab; }) ? state.tab : (todayTab || tabs[0].id);
    document.getElementById('tabs').innerHTML = tabs.map(function (t) { return '<a role="tab" href="#' + t.id + '" data-tab="' + t.id + '" aria-selected="' + (t.id === want) + '">' + e(t.label) + '<small>' + e(t.note) + '</small></a>'; }).join('');
    document.getElementById('panels').innerHTML = tabs.map(function (t) { return '<section class="panel" role="tabpanel" id="' + t.id + '"' + (t.id === want ? '' : ' hidden') + '>' + t.html + '</section>'; }).join('');
    open.forEach(function (id) { var x = document.getElementById(id); if (x) x.open = true; });
    wire();
    show(want, true);
  }

  function show(id, quiet) {
    state.tab = id;
    [].forEach.call(document.querySelectorAll('#tabs a'), function (a) { a.setAttribute('aria-selected', a.dataset.tab === id ? 'true' : 'false'); });
    [].forEach.call(document.querySelectorAll('section.panel'), function (p) { p.hidden = p.id !== id; p.classList.toggle('active', p.id === id); });
    if (location.hash.slice(1) !== id) history.replaceState(null, '', location.pathname + location.search + '#' + id);
    if (!quiet) window.scrollTo({ top: document.getElementById('tabs').offsetTop - 4 });
  }
  function wire() {
    [].forEach.call(document.querySelectorAll('#tabs a'), function (a) { a.addEventListener('click', function (ev) { ev.preventDefault(); show(a.dataset.tab); }); });
    [].forEach.call(document.querySelectorAll('nav.vtabs'), function (nav) {
      var key = nav.dataset.vt, links = [].slice.call(nav.querySelectorAll('a[data-mv]')), scope = nav.closest('section.panel');
      var secs = [].slice.call(scope.querySelectorAll('.sec[data-mv]'));
      function pick(v) { state.mv[key] = v; links.forEach(function (a) { a.classList.toggle('on', a.dataset.mv === v); }); secs.forEach(function (s) { s.classList.toggle('hide', s.dataset.mv !== v); }); }
      links.forEach(function (a) { a.addEventListener('click', function (ev) { ev.preventDefault(); pick(a.dataset.mv); }); });
      var v = state.mv[key]; pick(links.some(function (a) { return a.dataset.mv === v; }) ? v : links[0].dataset.mv);
    });
    [].forEach.call(document.querySelectorAll('tr.rowlink'), function (tr) {
      function go(ev) { if (ev.target.closest('button')) return; if (ev.target.closest('a') && !ev.target.closest('a.fxlink')) return; ev.preventDefault(); var x = document.getElementById('fx-' + tr.dataset.fx); if (!x) return; var pnl = x.closest('section.panel'); if (pnl && pnl.hidden) show(pnl.id, true); x.open = true; x.classList.add('flash'); setTimeout(function () { x.classList.remove('flash'); }, 1600); x.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      tr.addEventListener('click', go); tr.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(ev); });
    });
  }

  // ---------------------------------------------------------------- "I took this bet" (16 Oct)
  var BET_BASE = location.pathname.replace(/\/+$/, ''), dlg = document.getElementById('takeDlg'), cur = null;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (err) { return null; } }
  function betsKey() { return store('sbms.betsKey') || ''; }
  function calc() {
    var o = num(document.getElementById('takeOdds').value), st = num(document.getElementById('takeStake').value), c = (state.data && state.data.lastFull && state.data.lastFull.notes && state.data.lastFull.notes.settings && state.data.lastFull.notes.settings.commission) || 0.02;
    var p = cur && cur.pw !== '' ? num(cur.pw) : null, out = [];
    if (o && o > 1) out.push('Implied chance at ' + o.toFixed(2) + ': <b>' + (100 / o).toFixed(1) + '%</b>');
    if (p != null && o && o > 1) {
      var ev = p * (o - 1) * (1 - c) - (1 - p), be = 1 + (1 - p) / (p * (1 - c));
      out.push('Model (anchored): <b>' + (p * 100).toFixed(1) + '%</b> → EV <b class="' + (ev >= 0 ? 'pos' : 'neg') + '">' + (ev >= 0 ? '+' : '−') + Math.abs(ev * 100).toFixed(1) + '%</b> after commission' + (st ? ' (' + (ev >= 0 ? '+' : '−') + '£' + Math.abs(ev * st).toFixed(2) + ' expected)' : ''));
      out.push('Break-even odds for the model: ' + be.toFixed(2));
    } else if (p == null) out.push('No model view stored for this selection: EV will be blank.');
    if (o && st) out.push('Returns if it wins: £' + (st * o).toFixed(2) + ' (profit £' + (st * (o - 1) * (1 - c)).toFixed(2) + ' after commission)');
    document.getElementById('takeCalc').innerHTML = out.join('<br>');
  }
  function openTake(btn) {
    cur = { fid: btn.dataset.fid, key: btn.dataset.key, sid: btn.dataset.sid, pw: btn.dataset.pw };
    document.getElementById('takeWhat').textContent = btn.dataset.what;
    document.getElementById('takeOdds').value = btn.dataset.price ? num(btn.dataset.price).toFixed(2) : '';
    document.getElementById('takeStake').value = store('sbms.lastStake') || '';
    document.getElementById('takeNote').value = '';
    document.getElementById('takeKeyWrap').hidden = !!betsKey();
    document.getElementById('takeErr').textContent = state.data && !state.data.betsEnabled ? 'Logging is off until BETS_KEY is set on sbms-page in Render.' : '';
    calc();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    document.getElementById('takeOdds').focus();
  }
  function post(path, body) {
    var k = betsKey() || document.getElementById('takeKey').value.trim();
    return fetch(BET_BASE + path + location.search, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Bets-Key': k }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return { j: j, k: k }; }); });
  }
  ['takeOdds', 'takeStake'].forEach(function (id) { document.getElementById(id).addEventListener('input', calc); });
  document.getElementById('takeCancel').addEventListener('click', function () { dlg.close ? dlg.close() : dlg.removeAttribute('open'); });
  document.getElementById('takeForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var o = num(document.getElementById('takeOdds').value), st = num(document.getElementById('takeStake').value), errEl = document.getElementById('takeErr');
    if (!o || o < 1.01) { errEl.textContent = 'Enter the decimal odds you got (1.01 or more).'; return; }
    if (!st || st <= 0) { errEl.textContent = 'Enter the stake.'; return; }
    document.getElementById('takeGo').disabled = true; errEl.textContent = '';
    post('/bets/take', { fixture_id: num(cur.fid), key: cur.key, suggestion_id: cur.sid ? num(cur.sid) : null, odds: o, stake: st, note: document.getElementById('takeNote').value })
      .then(function (res) { store('sbms.betsKey', res.k); store('sbms.lastStake', String(st)); dlg.close ? dlg.close() : dlg.removeAttribute('open'); status.textContent = 'Bet logged (' + res.j.tier + ')'; load(); })
      .catch(function (err) { errEl.textContent = 'Not logged: ' + err.message + (/key/.test(err.message) ? '. Check the bets key.' : ''); if (/wrong bets key/.test(err.message)) { store('sbms.betsKey', ''); document.getElementById('takeKeyWrap').hidden = false; } })
      .then(function () { document.getElementById('takeGo').disabled = false; });
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button.take'); if (t) { ev.preventDefault(); ev.stopPropagation(); openTake(t); return; }
    var u = ev.target.closest('button.undo');
    if (u && confirm('Remove this bet from the real P&L? (Only open bets can be removed.)')) {
      post('/bets/undo', { id: num(u.dataset.undo) }).then(function () { load(); }).catch(function (err) { alert('Not removed: ' + err.message); });
    }
  });

  var dot = document.getElementById('dot'), status = document.getElementById('status');
  function load() {
    status.textContent = 'Reading…';
    fetch(DATA_URL, { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); })
      .then(function (d) {
        state.data = d; render(d);
        var lf = d.lastFull, stale = !lf || (new Date(d.now) - new Date(lf.finished_at)) > 2.5 * 3600e3;
        dot.className = 'dot' + (stale ? ' stale' : '');
        status.textContent = 'Live · read ' + hm(d.now) + (stale ? ' · no full run for over 2 hours' : '');
      })
      .catch(function (err) {
        dot.className = 'dot err';
        status.textContent = 'Could not read the model: ' + err.message;
        if (!state.data) { document.getElementById('h1').textContent = 'The model data could not be read'; document.getElementById('lede').textContent = 'Usually this means the bot has not run yet (its tables are created on the first run), or the database is unreachable. Details: ' + err.message; }
      });
  }
  document.getElementById('reload').addEventListener('click', function (ev) { ev.preventDefault(); load(); });
  window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (document.getElementById(id) && document.getElementById(id).matches('section.panel')) show(id, true); });
  document.documentElement.classList.add('js');
  load();
  setInterval(function () { if (!document.hidden) load(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.data && (Date.now() - new Date(state.data.now)) > 5 * 60 * 1000) load(); });
})();
</script>
</body></html>
